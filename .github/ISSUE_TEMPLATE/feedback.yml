name: Feedback
description: Tell us what worked, what broke, what to improve
title: "Feedback: "
labels: [feedback]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? Screenshots welcome (paste or drag them here).
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback?
      options:
        - Something is broken
        - Looks wrong
        - Idea / wish
        - It works, just saying hi
  - type: input
    id: version
    attributes:
      label: App version
      description: Filled in automatically when you use Send feedback in the app.
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Filled in automatically when you use Send feedback in the app.
